services:
  # ─────────────────────────────────────────────
  # Base de datos PostgreSQL
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: canchas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gad_beni_campos}
      POSTGRES_USER: ${DB_USERNAME:-canchas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-canchas} -d ${DB_DATABASE:-gad_beni_campos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis (cache + queue)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: canchas_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Backend Laravel
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: canchas_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: "Campos Deportivos GAD Beni"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY}

      LOG_CHANNEL: stderr
      LOG_LEVEL: warning

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-gad_beni_campos}
      DB_USERNAME: ${DB_USERNAME:-canchas}
      DB_PASSWORD: ${DB_PASSWORD:-secret}

      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis

      FILESYSTEM_DISK: public

      # SIREB / Paitití (completar con valores reales)
      RECAUDACIONES_SIMULADOR_HABILITADO: ${RECAUDACIONES_SIMULADOR_HABILITADO:-true}
      RECAUDACIONES_API_URL: ${RECAUDACIONES_API_URL:-}
      SIREB_TOKEN_URL: ${SIREB_TOKEN_URL:-}
      SIREB_CLIENT_ID: ${SIREB_CLIENT_ID:-}
      SIREB_CLIENT_SECRET: ${SIREB_CLIENT_SECRET:-}

      # Ibare OAuth
      IBARE_BASE_URL: ${IBARE_BASE_URL:-}
      IBARE_JWKS_URL: ${IBARE_JWKS_URL:-}
      IBARE_ISSUER: ${IBARE_ISSUER:-}
      IBARE_AUDIENCE: ${IBARE_AUDIENCE:-}

      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001"
    ports:
      - "8000:80"
    volumes:
      - storage_data:/var/www/html/storage/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────
  # Web Admin (React)
  # ─────────────────────────────────────────────
  web-admin:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api
    container_name: canchas_web_admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:80"

  # ─────────────────────────────────────────────
  # Web Public (React)
  # ─────────────────────────────────────────────
  web-public:
    build:
      context: ./web-public
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api
    container_name: canchas_web_public
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
  storage_data:
